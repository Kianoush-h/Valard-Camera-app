<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Valard Camera Setup Code</title>
<meta name="robots" content="noindex">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
<style>
  textarea { font: 14px/1.4 ui-monospace, Menlo, Consolas, monospace; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-height: 120px; resize: vertical;
    -webkit-user-select: text; user-select: text; word-break: break-all; }
  .screen { max-width: 560px; margin: 0 auto; }
</style>
</head>
<body>
<section class="screen">
  <header class="topbar"><div class="brand"><b>Valard</b> Camera · Setup code</div></header>
  <div class="card">
    <p class="muted">For the admin. Builds the one-time setup code crew members paste into the app.
      Everything happens in this browser; nothing is sent anywhere.</p>
    <label>Power Automate flow HTTP URL
      <textarea id="url" placeholder="https://…/triggers/manual/paths/invoke?…&sig=…"></textarea>
    </label>
    <label>Team PIN (must match the PIN in the flow's Condition)
      <input id="pin" autocomplete="off">
    </label>
    <button id="make" class="btn primary">Create setup code</button>
    <p id="err" class="err"></p>
    <label>Setup code: send this privately (Teams chat / email), not in public places
      <textarea id="code" readonly></textarea>
    </label>
    <button id="copy" class="btn">Copy code</button>
  </div>
  <p class="credit">Developed by Kianoush Haratiannejadi</p>
</section>
<script>
(function () {
  const $ = id => document.getElementById(id);
  $('make').onclick = () => {
    const u = $('url').value.trim(), p = $('pin').value.trim();
    $('err').textContent = '';
    if (!/^https:\/\/\S+sig=\S+/.test(u)) { $('err').textContent = 'Paste the full HTTP URL from the flow trigger (it contains "sig=").'; return; }
    if (p.length < 6) { $('err').textContent = 'Use a PIN of at least 6 characters.'; return; }
    const json = JSON.stringify({ u, p });
    const b64 = btoa(unescape(encodeURIComponent(json))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    $('code').value = 'VC1-' + b64;
  };
  $('copy').onclick = () => {
    if (!$('code').value) return;
    $('code').select();
    (navigator.clipboard ? navigator.clipboard.writeText($('code').value) : Promise.reject())
      .catch(() => document.execCommand('copy'))
      .finally(() => { $('copy').textContent = 'Copied ✓'; setTimeout(() => { $('copy').textContent = 'Copy code'; }, 2000); });
  };
})();
</script>
</body>
</html>
